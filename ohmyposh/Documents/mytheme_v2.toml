console_title_template = '{{ .Shell }} in {{ .Folder }}'
final_space = true
version = 3

[secondary_prompt]
  template = '❯❯ '
  foreground = 'green'
  background = 'transparent'

[transient_prompt]
  template = '❯ '
  background = 'transparent'
  foreground_templates = [
    '{{ if gt .Code 0 }}red{{ end }}',
    '{{ if eq .Code 1 }}gren{{ end }}'
  ]

[palette]
os = "#ACB0BE"
closer = "p:os"
pink = "#F5C2E7"
lavender = "#B4BEFE"
blue = "#89B4FA"

[[blocks]]
alignment = "left"
type = "prompt"

  [[blocks.segments]]
  foreground = "p:os"
  style = "plain"
  template = "{{ .Icon }} "
  type = "os"

  [[blocks.segments]]
  foreground = "p:blue"
  style = "plain"
  template = "{{ .UserName }}@{{ .HostName }} "
  type = "session"

  [[blocks.segments]]
  foreground = "p:pink"
  style = "plain"
  template = "{{ .Path }} "
  type = "path"

    [blocks.segments.options]
    folder_icon = "...."
    home_icon = "~"
    style = "agnoster_short"

  [[blocks.segments]]
  type = "python"
  style = "plain"
  foreground = "#ffd43b"
  template = "  {{ .Full }} {{ (.Venv) }} "

  [[blocks.segments]]
  foreground = "p:lavender"
  template = "{{ .HEAD }} "
  style = "plain"
  type = "git"

    [blocks.segments.options]
    branch_icon = " "
    cherry_pick_icon = " "
    commit_icon = " "
    fetch_status = false
    fetch_upstream_icon = false
    merge_icon = " "
    no_commits_icon = " "
    rebase_icon = " "
    revert_icon = " "
    tag_icon = " "

[[blocks]]
type = "rprompt"
overflow = "hidden"

  [[blocks.segments]]
  template = "{{ .FormattedMs }}"
  foreground = "yellow"
  background = "transparent"
  type = "executiontime"
  style = "plain"

    [blocks.segments.properties]
    cache_duration = "none"
    threshold = 5000

[[blocks]]
alignment = "left"
type = "prompt"
newline = true

  [[blocks.segments]]
  type = "text"
  style = "plain"
  template = " "
  foreground = "green"
  foreground_templates = [
    "{{ if eq .Code 0 }}green{{ end }}",
    "{{ if gt .Code 0 }}red{{ end }}"
  ]

